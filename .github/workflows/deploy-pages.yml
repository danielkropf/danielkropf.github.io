name: Deploy site to GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fm-datatracker/package-lock.json

      - name: Install dependencies
        working-directory: fm-datatracker
        run: npm ci

      - name: Verify version synchronization
        working-directory: fm-datatracker
        run: npm run check:version

      - name: Typecheck
        working-directory: fm-datatracker
        run: npm run typecheck

      - name: Test
        working-directory: fm-datatracker
        run: npm test

      - name: Build FM DataTracker
        working-directory: fm-datatracker
        env:
          VITE_SUPABASE_URL: ${{ github.event_name == 'pull_request' && 'https://placeholder.supabase.co' || secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ github.event_name == 'pull_request' && 'placeholder-anon-key' || secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
          VITE_BUILD_ID: ${{ github.sha }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "::error::VITE_SUPABASE_URL não foi configurada em Repository secrets ou Repository variables."
            exit 1
          fi
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::VITE_SUPABASE_ANON_KEY não foi configurada em Repository secrets ou Repository variables."
            exit 1
          fi
          npm run build

      - name: Assemble tested site
        if: github.event_name != 'pull_request'
        run: |
          mkdir _site
          rsync -a ./ _site/ \
            --exclude .git \
            --exclude .github \
            --exclude _site \
            --exclude fm-datatracker
          mkdir -p _site/fm-datatracker
          cp -R fm-datatracker/dist/. _site/fm-datatracker/

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
